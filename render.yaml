services:
  - type: web
    name: lyon-discord-manager
    runtime: python3
    plan: free
    buildCommand: unzip -q Lyon-Discord-Manager-sanitized.zip && pip install -r Lyon-Discord-Manager/bot/requirements.txt
    startCommand: python -u web_runner.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: SYNC_EMOJIS
        value: "false"
      - key: SYSTEMPRO_DATA_DIR
        value: /data/systempro
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: BOT_ID
        sync: false
      - key: OWNER_ID
        sync: false
      - key: BOT_SERVER_ID
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: WHATSAPP_API_URL
        sync: false
      - key: WHATSAPP_API_KEY
        sync: false
      - key: WHATSAPP_INSTANCE
        sync: false
